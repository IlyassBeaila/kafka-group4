global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kafka-broker'
    static_configs:
      - targets: ['kafka:9101']

  - job_name: 'kafka-connect'
    static_configs:
      - targets: ['connect:9102']

  - job_name: 'weather-consumer'
    static_configs:
      - targets: ['host.docker.internal:8080']